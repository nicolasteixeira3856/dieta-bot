<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nutri · wires Expressive</title>
<!--
AGENT — how to consume this file alone
1. Open in Edge/Chrome: wires/nutri-wires-expressive.html
2. Click “Export PNGs” (or open with ?export=all)
3. Save downloads into docs/qa/wire/ (overwrite)
4. Filenames are the contract:
   splash.png
   o1.png
   o2.png
   t0.png
   t0d2.png
   t0fds.png
   t1.png
   t1load.png
   t2.png
   t2q.png
   t3quero.png
   t3tenho.png
   t3ideia.png
5. Emulator screencap goes to docs/qa/android/current/{dark|light}/<same-id>.png
6. Compare layout, tokens, type, radius, ButtonGroup, CTA. Ignore notch / clock / system bar.
7. Iterate UI until the list of diffs is empty.
8. splash is a cold start. It is NOT a freeze. Do not “fix” it by removing the splash.
Headless fallback: node tools/export-wires.mjs
-->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --phone: #0e1114;
    --surf: #171b20; --surf2: #1e242b; --line: #2a3139;
    --text: #f3f5f7; --muted: #8b939c; --dim: #5c6570;
    --gold: #e8b86d; --gold-dim: rgba(232,184,109,.16);
    --good: #7dda9a; --bad: #e07a6a;
    --cta: #f3f5f7; --cta-ink: #111111;
    --r-chip: 14px; --r-sheet: 22px; --r-phone: 42px; --r-inc: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: "SF Pro Text", Inter, ui-sans-serif, system-ui, sans-serif; }
  body { min-height: 100vh; }
  button { font-family: inherit; }
  .page { display: grid; grid-template-columns: 250px 1fr 280px; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; }
  @media (max-width: 1080px) { .page { grid-template-columns: 1fr; } }
  .brand { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 590; letter-spacing: -.03em; }
  .lede { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
  .nav { margin-top: 20px; display: flex; flex-direction: column; gap: 3px; }
  .nav .k { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 14px 10px 4px; }
  .nav button { text-align: left; background: transparent; border: 0; color: var(--muted); padding: 8px 10px; border-radius: 12px; cursor: pointer; font-size: 13px; }
  .nav button:hover { background: var(--surf); color: var(--text); }
  .nav button.on { background: var(--surf2); color: var(--text); }
  .export { margin-top: 18px; }
  .export button, .cta { border: 0; cursor: pointer; }
  .export button {
    width: 100%; background: var(--cta); color: var(--cta-ink);
    font-size: 13px; font-weight: 600; padding: 12px; border-radius: 14px;
  }
  .export p { font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.4; }
  #status { font-size: 12px; color: var(--gold); margin-top: 8px; min-height: 16px; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .phone {
    width: 390px; height: 844px; background: var(--phone);
    border-radius: var(--r-phone); border: 1px solid #2c333c;
    box-shadow: 0 40px 80px rgba(0,0,0,.45);
    position: relative; overflow: hidden;
  }
  .notch { height: 48px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 22px 8px; color: var(--muted); font-size: 12px; font-weight: 560; }
  .screen { height: calc(844px - 48px); position: relative; overflow: hidden; }
  .pad { padding: 8px 20px 20px; }
  .saldo { font-size: 34px; font-weight: 590; letter-spacing: -.04em; line-height: 1.05; }
  .muted { color: var(--muted); font-size: 13px; }
  .dim { color: var(--dim); font-size: 12px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .gold { color: var(--gold); }
  .card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r-chip); padding: 14px; }
  .hero { background: var(--surf2); border-radius: var(--r-inc); padding: 16px; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
  .group { display: flex; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; padding: 3px; }
  .group button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 11px 6px; font-size: 12px; font-weight: 560; cursor: pointer; border-radius: 15px; line-height: 1.2; }
  .group button.on { background: var(--gold-dim); color: var(--gold); }
  .group.stack { flex-direction: column; border-radius: 20px; }
  .group.stack button { text-align: left; padding: 13px 14px; font-size: 14px; border-radius: 16px; }
  .cta { width: 100%; background: var(--cta); color: var(--cta-ink); font-size: 15px; font-weight: 600; padding: 14px 16px; border-radius: 18px; }
  .cta.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .field { width: 100%; background: var(--surf); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 14px; font-size: 16px; outline: none; }
  .field.lg { font-size: 28px; font-weight: 560; letter-spacing: -.03em; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surf2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px 8px 12px; font-size: 13px; }
  .composer { background: var(--surf); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; gap: 10px; align-items: center; }
  .composer .box { flex: 1; color: var(--muted); font-size: 14px; }
  .cam { width: 36px; height: 36px; border-radius: 12px; background: var(--surf2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .disclaimer { font-size: 11px; color: var(--dim); margin-top: 12px; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.46); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 18px 22px; min-height: 42%; }
  .grab { width: 36px; height: 4px; border-radius: 99px; background: var(--line); margin: 4px auto 14px; }
  .loader { width: 28px; height: 28px; margin: 8px auto; background: var(--gold); animation: morph 1.1s ease-in-out infinite; }
  @keyframes morph { 0%{border-radius:30% 70% 70% 30%/30% 30% 70% 70%} 50%{border-radius:70% 30% 30% 70%/70% 70% 30% 30%;transform:rotate(60deg)} 100%{border-radius:30% 70% 70% 30%/30% 30% 70% 70%;transform:rotate(120deg)} }
  .row { display: flex; gap: 8px; align-items: center; }
  .space { height: 12px; } .space2 { height: 18px; }
  .bottom { position: absolute; left: 20px; right: 20px; bottom: 22px; }
  .notes { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .notes h3 { color: var(--text); font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  .notes code { font-size: 11px; color: var(--gold); }
  .tag { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .mark { width: 48px; height: 48px; border-radius: 14px; background: var(--gold); }
  .word { font-size: 22px; font-weight: 590; letter-spacing: -.03em; }
  .hair { width: 80px; height: 6px; border-radius: 99px; background: var(--gold); }
</style>
</head>
<body>
<div class="page">
  <aside>
    <div class="brand">Nutri · M3 Expressive</div>
    <h1>Wires</h1>
    <p class="lede">Gold PNGs live in docs/qa/wire/. App screenshots live in docs/qa/android/current/{dark|light}/. Old shots in docs/qa/_legacy/.</p>
    <nav class="nav" id="nav"></nav>
    <div class="export">
      <button type="button" id="btn-export">Export PNGs</button>
      <div id="status"></div>
      <p>Saves splash.png … t3ideia.png. Put files in docs/qa/wire/. Splash is a cold start, not a freeze.</p>
    </div>
  </aside>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="notch" id="notch"><span>9:41</span><span>SP</span></div>
      <div class="screen" id="screen"></div>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const screens = [
  { id: "splash", file: "splash.png", g: "System", l: "Splash" },
  { id: "o1", file: "o1.png", g: "Onboarding", l: "O1 Teto" },
  { id: "o2", file: "o2.png", g: "Onboarding", l: "O2 Eat-back" },
  { id: "t0", file: "t0.png", g: "Home", l: "T0 dia 1" },
  { id: "t0d2", file: "t0d2.png", g: "Home", l: "T0 dia 2 · chip" },
  { id: "t0fds", file: "t0fds.png", g: "Home", l: "T0 fds" },
  { id: "t1", file: "t1.png", g: "Log", l: "T1 sheet" },
  { id: "t1load", file: "t1load.png", g: "Log", l: "T1 loading" },
  { id: "t2", file: "t2.png", g: "Log", l: "T2 card" },
  { id: "t2q", file: "t2q.png", g: "Log", l: "T2 confiança baixa" },
  { id: "t3quero", file: "t3quero.png", g: "Fit", l: "T3 Quero" },
  { id: "t3tenho", file: "t3tenho.png", g: "Fit", l: "T3 Tenho" },
  { id: "t3ideia", file: "t3ideia.png", g: "Fit", l: "T3 Sem ideia" },
];
let go = "t0";
let o1 = 0, o2 = 0;

function group3(labels, sel, fn) {
  return `<div class="group">${labels.map((x,i)=>`<button class="${i===sel?'on':''}" onclick="${fn}(${i})">${x}</button>`).join("")}</div>`;
}
function groupStack(labels, sel, fn) {
  return `<div class="group stack">${labels.map((x,i)=>`<button class="${i===sel?'on':''}" onclick="${fn}(${i})">${x}</button>`).join("")}</div>`;
}
function setO1(i){ o1=i; render(); }
function setO2(i){ o2=i; render(); }
function setT3(i){ go=["t3quero","t3tenho","t3ideia"][i]; render(); }
function noop(i){}

function homeBase(extra) {
  return `
    <div class="pad">
      <div class="dim">quinta, 24 set</div>
      <div class="space"></div>
      <div class="saldo">1.840</div>
      <div class="muted">cabe na janta</div>
      <div class="space2"></div>
      <div class="hero">
        <div class="tag">próxima</div>
        <div style="margin-top:6px;font-weight:560">Janta · reserva 520</div>
        <div class="muted" style="margin-top:4px">almoço já 640 · P 48 g</div>
        <div class="bar"><i style="width:38%"></i></div>
      </div>
      ${extra || ""}
      <div class="space2"></div>
      <div class="composer"><div class="box">o que comeu</div><div class="cam">▣</div></div>
      <div class="space"></div>
      <button class="cta" onclick="go='t3quero';render()">o que cabe agora</button>
      <p class="disclaimer">Estimativa, não consulta.</p>
    </div>`;
}
function sheet(title, body, cta, action) {
  return `
    <div class="sheet-bg"></div>
    <div class="sheet">
      <div class="grab"></div>
      <div style="font-weight:590;font-size:18px;letter-spacing:-.02em">${title}</div>
      <div class="space"></div>
      ${body}
      <div class="space2"></div>
      <button class="cta" onclick="${action}">${cta}</button>
    </div>`;
}

const view = {
  splash() {
    return {
      html: `<div class="splash"><div class="mark"></div><div class="word">Nutri</div><div class="hair"></div><div class="dim">estimativa, não consulta</div></div>`,
      note: "Cold start ≤2s. This is the splash. Not a freeze. Do not delete it. No spinner."
    };
  },
  o1() {
    const modes = ["Mesmo todos os dias","Útil / fds","7 dias"];
    const fields = [
      `<input class="field lg" value="2000" /><div class="dim" style="margin-top:6px">kcal · todos os dias</div>`,
      `<div class="row"><input class="field" value="2000" style="flex:1"><input class="field" value="2300" style="flex:1"></div><div class="dim" style="margin-top:6px">útil · fds</div>`,
      `<div class="row">${["S","T","Q","Q","S","S","D"].map((d,i)=>`<input class="field" value="${i>4?2300:2000}" style="padding:10px 4px;text-align:center;font-size:12px">`).join("")}</div><div class="dim" style="margin-top:6px">7 dias</div>`
    ][o1];
    return {
      html: `<div class="pad"><div class="dim">1 / 2</div><div class="space"></div>
        <div style="font-size:22px;font-weight:590;letter-spacing:-.03em">Teto do dia.</div>
        <div class="muted" style="margin-top:6px">Mesmo número ou varia.</div>
        <div class="space2"></div>${groupStack(modes, o1, "setO1")}
        <div class="space2"></div>${fields}
        <div class="bottom"><button class="cta" onclick="go='o2';render()">Continuar</button></div></div>`,
      note: "O1 ButtonGroup stacked. 3 modes. Field 28pt when single ceiling."
    };
  },
  o2() {
    const extra = o2===1
      ? `<div class="space"></div><input class="field lg" value="50" /><div class="dim" style="margin-top:6px">% do treino. default 50. sem cap</div>`
      : `<div class="space"></div><div class="muted">${o2===0?"crédito sempre 0":"crédito = kcal do treino"}</div>`;
    return {
      html: `<div class="pad"><div class="dim">2 / 2</div><div class="space"></div>
        <div style="font-size:22px;font-weight:590;letter-spacing:-.03em">Treino vira crédito?</div>
        <div class="muted" style="margin-top:6px">Sem número no dia, crédito = 0.</div>
        <div class="space2"></div>${group3(["0%","%","100%"], o2, "setO2")}
        ${extra}
        <div class="bottom"><button class="cta" onclick="go='t0';render()">Começar</button></div></div>`,
      note: "O2 eat-back 0 / % / 100. No cap."
    };
  },
  t0() { return { html: homeBase(""), note: "T0 day 1. 34pt remaining. Zero chips. CTA o que cabe agora." }; },
  t0d2() {
    const extra = `<div class="space2"></div><div class="chip">iogurte manhã <span style="color:var(--dim)">×</span></div>
      <div class="dim" style="margin-top:8px">desnatado? perguntado 1x</div>`;
    return { html: homeBase(extra), note: "Chip on 2nd stable log of the same window. Removable." };
  },
  t0fds() {
    return {
      html: `<div class="pad"><div class="dim">sábado, 26 set</div><div class="space"></div>
        <div class="saldo">2.000</div><div class="muted">fds · almoço + janta + fecha</div>
        <div class="space2"></div>
        <div class="hero"><div class="tag">próxima</div>
          <div style="margin-top:6px;font-weight:560">Almoço</div>
          <div class="muted" style="margin-top:4px">café não cobrado</div>
          <div class="bar"><i style="width:0%"></i></div></div>
        <div class="space2"></div>
        <div class="composer"><div class="box">o que comeu</div><div class="cam">▣</div></div>
        <div class="space"></div>
        <button class="cta" onclick="go='t3ideia';render()">o que cabe agora</button>
        <p class="disclaimer">Estimativa, não consulta.</p></div>`,
      note: "Weekend: lunch + dinner + close. No breakfast nag."
    };
  },
  t1() {
    return {
      html: homeBase("") + sheet("Registrar",
        `<div class="field">2 pães, ovo, café com leite</div><div class="space"></div>
         <div class="row"><div class="cam" style="width:56px;height:56px;border-radius:14px">foto</div><div class="dim">JPEG 70 · ≤1280</div></div>`,
        "Enviar", "go='t1load';render()"),
      note: "T1 sheet radius 22. Text + photo."
    };
  },
  t1load() {
    return {
      html: homeBase("") + sheet("Registrar",
        `<div class="field">2 pães, ovo, café com leite</div><div class="space2"></div>
         <div class="loader"></div><div class="dim" style="text-align:center">estimando</div>`,
        "Enviar", "go='t2';render()"),
      note: "LoadingIndicator, not a circular spinner. Not a freeze."
    };
  },
  t2() {
    return {
      html: `<div class="pad"><div class="dim">confirmação</div><div class="space2"></div>
        <div class="card"><div style="font-weight:560">2 pães + ovo + café</div>
          <div class="space"></div><div class="saldo" style="font-size:28px">420</div>
          <div class="muted">kcal · 22 g P</div><div class="space"></div>
          <div class="good">Cabe. Sobra 1.420 pra janta.</div></div>
        <div class="bottom"><button class="cta" onclick="go='t0d2';render()">Ok</button>
          <div class="space"></div><button class="cta ghost" onclick="go='t1';render()">Desfazer</button></div></div>`,
      note: "T2 number first. Fits / does not + remaining for dinner."
    };
  },
  t2q() {
    return {
      html: `<div class="pad"><div class="dim">confiança baixa · 1 pergunta</div><div class="space2"></div>
        <div class="card"><div style="font-weight:560">2 pães + ovo + café</div>
          <div class="muted" style="margin-top:6px">~380–480 kcal</div><div class="space2"></div>
          <div>Pão era francês?</div><div class="space"></div>
          ${group3(["Sim","Forma","Esquece"], 0, "noop")}</div>
        <div class="bottom"><button class="cta" onclick="go='t2';render()">Confirmar</button></div></div>`,
      note: "One question if confidence is not high."
    };
  },
  t3quero() {
    return {
      html: homeBase("") + sheet("O que cabe agora",
        `${group3(["Quero","Tenho","Sem ideia"], 0, "setT3")}
         <div class="space"></div><input class="field" value="lasanha"><div class="space"></div>
         <div class="card"><div class="bad">Inteira não cabe.</div>
           <div style="margin-top:8px">1/2 lasanha + salada · 480 kcal · 28 g P</div>
           <div class="muted" style="margin-top:4px">sobra 40 pra um café</div></div>`,
        "Encaixar 480", "go='t2';render()"),
      note: "T3 Want. Never offer a plate that blows the ceiling."
    };
  },
  t3tenho() {
    return {
      html: homeBase("") + sheet("O que cabe agora",
        `${group3(["Quero","Tenho","Sem ideia"], 1, "setT3")}
         <div class="space"></div><input class="field" value="ovo, arroz, alface"><div class="space"></div>
         <div class="card"><div class="good">Cabe.</div>
           <div style="margin-top:8px">omelete 3 ovos + arroz 180 g + folha · 520 kcal · 32 g P</div></div>`,
        "Encaixar 520", "go='t2';render()"),
      note: "T3 Have. Uses what is in the house."
    };
  },
  t3ideia() {
    return {
      html: homeBase("") + sheet("O que cabe agora",
        `${group3(["Quero","Tenho","Sem ideia"], 2, "setT3")}
         <div class="space"></div>
         <div class="card"><div class="good">omelete 3 ovos · 420 kcal · 30 g P</div>
           <div class="dim" style="margin-top:4px">preserva a janta</div></div>
         <div class="space"></div>
         <div class="card"><div>sopa + pão · 380 kcal · 18 g P</div>
           <div class="dim" style="margin-top:4px">preserva a janta</div></div>`,
        "Já comi", "go='t1';render()"),
      note: "T3 No idea. Two options that keep dinner + already ate."
    };
  }
};

function render() {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.id===go));
  const meta = screens.find(s => s.id===go);
  const v = view[go]();
  document.getElementById("notch").style.display = go === "splash" ? "none" : "flex";
  document.getElementById("screen").style.height = go === "splash" ? "844px" : "calc(844px - 48px)";
  document.getElementById("screen").innerHTML = v.html;
  document.getElementById("notes").innerHTML = `<div class="tag">${meta.file}</div><h3>${meta.l}</h3><p>${v.note}</p>
    <h3>Compare</h3><p>Layout, tokens, 34pt, radius 14/22, ButtonGroup, CTA #f3f5f7/#111. Ignore system clock.</p>
    <h3>Forbidden</h3><p>Appbar · FAB · BottomNav · dynamic color · treating splash as a freeze.</p>`;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function exportOne(item) {
  go = item.id; render();
  await sleep(80);
  const node = document.getElementById("phone");
  const canvas = await html2canvas(node, { backgroundColor: "#0e1114", scale: 2, useCORS: true });
  const a = document.createElement("a");
  a.download = item.file;
  a.href = canvas.toDataURL("image/png");
  a.click();
}
async function exportAll() {
  const st = document.getElementById("status");
  if (typeof html2canvas !== "function") {
    st.textContent = "html2canvas missing. Use node tools/export-wires.mjs";
    return;
  }
  const prev = go;
  for (const item of screens) {
    st.textContent = "export " + item.file;
    await exportOne(item);
    await sleep(250);
  }
  go = prev; render();
  st.textContent = "done · move files to docs/qa/wire/";
}
document.getElementById("btn-export").onclick = exportAll;

(function nav() {
  const el = document.getElementById("nav");
  let last = "";
  screens.forEach(s => {
    if (s.g !== last) { el.insertAdjacentHTML("beforeend", `<span class="k">${s.g}</span>`); last = s.g; }
    const b = document.createElement("button");
    b.dataset.id = s.id; b.textContent = s.l;
    b.onclick = () => { go = s.id; render(); };
    el.appendChild(b);
  });
  render();
  if (/export=all/.test(location.search)) setTimeout(exportAll, 400);
})();
</script>
</body>
</html>
