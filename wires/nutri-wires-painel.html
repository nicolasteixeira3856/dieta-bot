<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<title>Nutri · wires painel</title>
<!--
AGENT — how to consume this file alone
1. Open in Edge/Chrome: nutri-wires-painel.html
2. Click “Export PNGs” (or open with ?export=all)
3. Save downloads into docs/qa/wire/
4. Filenames are the contract:
   splash.png o1.png o2.png o3.png o4.png
   home0.png home1.png homeX.png
   chat0.png chatL.png chatE.png chatT.png chatP.png chatF.png chatG.png
   cfg.png wipe.png push.png
   Light extra: light-<same>
5. Emulator screencap goes to docs/qa/android/current/{dark|light}/<same-id>.png
6. Compare layout, tokens, type, radius, ButtonGroup, CTA. Ignore notch / clock / system bar.
7. Iterate UI until the list of diffs is empty.
8. splash is a cold start. It is NOT a freeze. Do not “fix” it by removing the splash.
Headless fallback: node tools/export-wires.mjs
-->

<style>
  :root, body.dark {
    --bg: #0b0d10;
    --panel: #12151a;
    --phone: #0e1114;
    --surf: #171b20;
    --surf2: #1e242b;
    --line: #2a3139;
    --text: #f3f5f7;
    --muted: #8b939c;
    --dim: #5c6570;
    --gold: #e8b86d;
    --gold-dim: rgba(232,184,109,.16);
    --good: #7dda9a;
    --bad: #e07a6a;
    --bad-dim: rgba(224,122,106,.14);
    --cta: #f3f5f7;
    --on-cta: #111111;
    --ring-track: #232a31;
    --phone-rim: #2c333c;
    --phone-outer: #16191e;
    --sheet: #14181d;
    --grab: #3a424c;
    --scrim: rgba(0,0,0,.45);
  }
  body.light {
    --bg: #f4f3f0;
    --panel: #eceae6;
    --phone: #f7f6f3;
    --surf: #ffffff;
    --surf2: #e8e6e2;
    --line: #d5d2cc;
    --text: #14161a;
    --muted: #5c636b;
    --dim: #8b939c;
    --gold: #b8873d;
    --gold-dim: rgba(184,135,61,.14);
    --good: #1f8a4c;
    --bad: #c14d40;
    --bad-dim: rgba(193,77,64,.12);
    --cta: #111111;
    --on-cta: #f3f5f7;
    --ring-track: #e0ddd6;
    --phone-rim: #d0ccc4;
    --phone-outer: #ddd9d1;
    --sheet: #ffffff;
    --grab: #c9c4bb;
    --scrim: rgba(20,22,26,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: "Google Sans", "Inter", "SF Pro Text", ui-sans-serif, system-ui, sans-serif; }
  body { min-height: 100vh; }

  .page {
    display: grid;
    grid-template-columns: 268px 1fr 300px;
    gap: 28px;
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px 24px 56px;
  }
  @media (max-width: 1120px) { .page { grid-template-columns: 1fr; } }

  .brand { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; }
  .lede { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 8px; }

  .theme-row { display: flex; gap: 6px; margin-top: 16px; }
  .theme-row button {
    flex: 1; border: 1px solid var(--line); background: var(--surf); color: var(--muted);
    padding: 8px; border-radius: 12px; cursor: pointer; font: 600 12px inherit;
  }
  .theme-row button.on { background: var(--text); color: var(--on-cta); border-color: var(--text); }

  .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 3px; }
  .nav .k { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 16px 10px 5px; }
  .nav button {
    text-align: left; background: transparent; border: 0; color: var(--muted);
    padding: 8px 10px; border-radius: 12px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .nav button:hover { background: var(--surf); color: var(--text); }
  .nav button.on { background: var(--surf2); color: var(--text); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone {
    width: 390px; height: 844px; background: var(--phone);
    border-radius: 42px; border: 1px solid var(--phone-rim);
    box-shadow: 0 0 0 8px var(--phone-outer), 0 40px 80px rgba(0,0,0,.45);
    overflow: hidden; position: relative;
  }
  .notch {
    height: 52px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 10px; font-size: 12px; color: var(--text); font-weight: 600;
  }
  .screen { height: calc(844px - 52px); overflow: auto; padding: 4px 20px 28px; position: relative; }
  .screen.tight { padding: 0; overflow: hidden; }
  .screen.ob { padding-bottom: 88px; }
  .screen.ob > .cta { position: absolute; left: 20px; right: 20px; bottom: 24px; margin-top: 0; }
  .screen.home { padding-bottom: 108px; }
  .screen::-webkit-scrollbar { width: 0; }

  .h-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .h1 { font-size: 28px; font-weight: 590; letter-spacing: -.03em; line-height: 1.12; margin: 6px 0 8px; }
  .subcopy { color: var(--muted); font-size: 14px; line-height: 1.45; }

  .bgroup {
    display: flex; gap: 3px; margin: 18px 0 14px;
    background: var(--surf); border: 1px solid var(--line);
    border-radius: 18px; padding: 4px;
  }
  .bgroup.col { flex-direction: column; }
  .bgroup button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    font: 600 13px/1.2 inherit; padding: 12px 10px; border-radius: 14px; cursor: pointer;
    text-align: center; font-family: inherit;
  }
  .bgroup.col button { text-align: left; padding: 13px 14px; }
  .bgroup button b { display: block; color: var(--text); font-weight: 600; font-size: 14px; }
  .bgroup button small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; margin-top: 3px; }
  .bgroup button.on { background: var(--text); color: var(--on-cta); }
  .bgroup button.on b, .bgroup button.on small { color: var(--on-cta); }
  .bgroup button.on small { opacity: .62; }
  .bgroup.row3 button { padding: 11px 6px; font-size: 12px; }

  .label { font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .field {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; font-size: 28px; font-weight: 560; letter-spacing: -.03em;
    border-radius: 14px; border: 1px solid var(--line); background: var(--surf);
  }
  .field span { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .field.sm { font-size: 18px; padding: 12px 14px; }
  .fine { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 12px; }
  .disc { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 14px; }

  .cta {
    width: 100%; padding: 15px; text-align: center; font-size: 15px; font-weight: 600;
    background: var(--cta); color: var(--on-cta); border: 0; cursor: pointer;
    margin-top: 18px; border-radius: 999px; font-family: inherit;
  }
  .cta.ghost { background: var(--surf2); color: var(--text); border: 1px solid var(--line); }
  .cta.bad { background: var(--bad); color: #111; }
  .cta.sm { padding: 10px 14px; font-size: 13px; margin-top: 0; width: auto; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; min-height: 36px;
  }
  .topbar .date { font-size: 13px; color: var(--muted); }
  .ico {
    width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--surf); color: var(--text); display: grid; place-items: center;
    font-size: 15px; cursor: pointer;
  }

  .ring-wrap { display: flex; flex-direction: column; align-items: center; padding: 8px 0 6px; }
  .ring {
    width: 196px; height: 196px; border-radius: 50%;
    display: grid; place-items: center;
    background:
      conic-gradient(var(--gold) var(--pct, 0%), var(--ring-track) 0);
    position: relative;
  }
  .ring.over {
    background: conic-gradient(var(--bad) var(--pct, 0%), var(--ring-track) 0);
  }
  .ring::before {
    content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--phone);
  }
  .ring-in { position: relative; z-index: 1; text-align: center; }
  .ring-in .n { font-size: 34px; font-weight: 590; letter-spacing: -.04em; line-height: 1; }
  .ring-in .u { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ring-in .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .macs { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; }
  .mac {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .mac b { color: var(--text); font-weight: 600; }
  .mbar { height: 6px; background: var(--ring-track); border-radius: 99px; overflow: hidden; }
  .mbar > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
  .mbar.over > i { background: var(--bad); }

  .slot {
    background: var(--surf); border: 1px solid var(--line); border-radius: 20px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .slot-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .slot-h b { font-size: 14px; font-weight: 600; }
  .slot-h span { font-size: 11px; color: var(--muted); }
  .slot-line { font-size: 13px; color: var(--muted); padding: 5px 0; border-top: 1px solid var(--line); }
  .slot-line:first-of-type { border-top: 0; }
  .slot-line b { color: var(--text); font-weight: 500; }
  .slot-line .kcal { float: right; color: var(--muted); font-size: 12px; }
  .slot.empty .hint { color: var(--muted); font-size: 13px; padding: 6px 0 2px; }
  .slot.skip .hint { color: var(--muted); font-style: italic; padding: 6px 0 2px; }

  .fab {
    position: absolute; right: 22px; bottom: 28px;
    width: 64px; height: 64px; border-radius: 32px;
    background: var(--gold); color: #111;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
    border: 0;
  }

  .chat-col { display: flex; flex-direction: column; height: 100%; }
  .chat-top {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .chat-top b { font-size: 16px; font-weight: 600; }
  .chat-top span { font-size: 11px; color: var(--dim); }
  .thread { flex: 1; overflow: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
  .sep { text-align: center; font-size: 11px; color: var(--dim); letter-spacing: .04em; margin: 4px 0 6px; }
  .bub { max-width: 82%; padding: 10px 12px; font-size: 14px; line-height: 1.4; border: 1px solid var(--line); }
  .bub.me { align-self: flex-end; background: var(--surf2); border-radius: 18px 18px 6px 18px; }
  .bub.ai { align-self: flex-start; background: var(--surf); border-radius: 18px 18px 18px 6px; }
  .bub .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .thumb {
    width: 220px; height: 124px; border-radius: 14px; margin-bottom: 8px;
    background: linear-gradient(135deg, #2a2418 0%, #1a1d22 60%);
    border: 1px solid var(--line); display: grid; place-items: center;
    color: var(--dim); font-size: 12px;
  }
  body.light .thumb { background: linear-gradient(135deg, #efe4cc, #e8e6e2); }

  .composer {
    display: flex; gap: 8px; align-items: center;
    margin: 8px 12px 16px; padding: 8px 8px 8px 14px;
    background: var(--surf); border: 1px solid var(--line); border-radius: 28px;
  }
  .composer span { flex: 1; color: var(--muted); font-size: 14px; }
  .clip, .send {
    width: 40px; height: 40px; border-radius: 20px; border: 0;
    display: grid; place-items: center; font-size: 14px; font-weight: 700;
  }
  .clip { background: var(--surf2); color: var(--text); }
  .send { background: var(--gold); color: #111; }

  .actions { display: flex; gap: 3px; padding: 0 16px 4px; }
  .actions .bgroup { margin: 0; flex: 1; }

  .bub.ai.wait { display: flex; align-items: center; gap: 10px; width: auto; min-height: 44px; padding: 8px 12px; }
  .wait-l { font-size: 13px; color: var(--muted); }
  .blob {
    width: 22px; height: 22px; background: var(--gold);
    animation: morph 1.15s ease-in-out infinite; flex: none;
  }
  @keyframes morph {
    0%   { border-radius: 42% 58% 48% 52% / 48% 42% 58% 52%; transform: rotate(0deg) scale(1); }
    33%  { border-radius: 58% 42% 62% 38% / 42% 58% 38% 62%; transform: rotate(12deg) scale(1.06); }
    66%  { border-radius: 38% 62% 44% 56% / 62% 38% 56% 44%; transform: rotate(-8deg) scale(.96); }
    100% { border-radius: 42% 58% 48% 52% / 48% 42% 58% 52%; transform: rotate(0deg) scale(1); }
  }

  .scrim {
    position: absolute; inset: 52px 0 0; background: var(--scrim);
    display: flex; align-items: flex-end;
  }
  .sheet {
    width: 100%; background: var(--sheet);
    border-top-left-radius: 28px; border-top-right-radius: 28px;
    padding: 10px 20px 26px; border-top: 1px solid var(--line);
  }
  .grab { width: 40px; height: 4px; background: var(--grab); border-radius: 99px; margin: 4px auto 14px; }
  .sheet h3 { font-size: 16px; margin-bottom: 12px; }
  .opt {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; background: var(--surf); border: 1px solid var(--line);
    border-radius: 16px; margin-bottom: 8px; font-size: 14px;
  }
  .opt.on { border-color: var(--gold); background: var(--gold-dim); }
  .opt small { color: var(--dim); }

  .dialog {
    position: absolute; inset: 52px 0 0; background: var(--scrim);
    display: grid; place-items: center; padding: 24px;
  }
  .dlg {
    width: 100%; background: var(--surf); border: 1px solid var(--line);
    border-radius: 22px; padding: 20px 18px 16px;
  }
  .dlg h3 { font-size: 17px; margin-bottom: 8px; }
  .dlg p { font-size: 14px; color: var(--muted); line-height: 1.45; margin-bottom: 16px; }

  .row-edit {
    display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .row-edit .nm { flex: 1; }
  .chip-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .chip-sugg span {
    font-size: 11px; padding: 6px 10px; border-radius: 999px;
    background: var(--surf2); border: 1px solid var(--line); color: var(--muted);
  }

  .cfg { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .cfg-item {
    background: var(--surf); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .cfg-item .k { font-size: 14px; font-weight: 600; }
  .cfg-item .v { font-size: 13px; color: var(--muted); text-align: right; }
  .cfg-item .v small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 16px 2px 6px; }

  .splash { height: 100%; display: grid; place-items: center; text-align: center; }
  .mark { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
  .splash h2 { font-size: 34px; font-weight: 590; letter-spacing: -.04em; margin: 8px 0 6px; }
  .push {
    width: 100%; background: var(--surf); border: 1px solid var(--line);
    border-radius: 22px; padding: 14px 16px; margin-top: 24px; text-align: left;
  }
  .push .app { font-size: 11px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
  .push b { display: block; font-size: 15px; margin: 4px 0 2px; }
  .push p { font-size: 13px; color: var(--muted); }
  .push .acts { display: flex; gap: 8px; margin-top: 10px; }

  .notes { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .notes h2 { color: var(--text); font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
  .notes h2:first-child { margin-top: 0; }
  .notes code { font-size: 11px; color: var(--gold); }
  .pill-map {
    display: inline-block; background: var(--surf2); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px 6px; font-size: 11px; color: var(--text); margin: 2px 2px 2px 0;
  }

  .export-row { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .export-row button {
    border:1px solid var(--line); background:var(--surf); color:var(--text);
    padding:10px 12px; border-radius:12px; cursor:pointer; font:600 12px inherit; text-align:left;
  }
  .export-row button.primary { background:var(--gold); color:#111; border-color:transparent; }
  #status { color:var(--muted); font-size:11px; line-height:1.4; min-height:16px; }
</style>
</head>
<body class="dark">
<div class="page">
  <aside>
    <div class="brand">Nutri · wires</div>
    <h1>Painel + Chat</h1>
    <p class="lede">Home relógio. Registro no Chat. Tokens gold. Sem BottomNav. Sem composer na Home.</p>
    <div class="theme-row">
      <button type="button" id="th-dark" class="on">Dark</button>
      <button type="button" id="th-light">Light</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="export-row">
      <button type="button" class="primary" id="btn-export">Export PNGs</button>
      <button type="button" id="btn-export-both">Export dark + light</button>
      <div id="status">Salva no Downloads. Mover para docs/qa/wire/. ?export=all</div>
    </div>
  </aside>
  <main class="stage">
    <div class="phone" id="phone"></div>
    <div class="lede" id="caption" style="max-width:390px;text-align:center"></div>
  </main>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const SCREENS = [
  { id: "splash", group: "Entrada", label: "Splash", file: "splash.png" },
  { id: "o1", group: "Onboarding", label: "O1 Corpo + teto", file: "o1.png" },
  { id: "o2", group: "Onboarding", label: "O2 Eat-back", file: "o2.png" },
  { id: "o3", group: "Onboarding", label: "O3 Refeições", file: "o3.png" },
  { id: "o4", group: "Onboarding", label: "O4 Macros", file: "o4.png" },
  { id: "home0", group: "Home", label: "Home vazia", file: "home0.png" },
  { id: "home1", group: "Home", label: "Home no dia", file: "home1.png" },
  { id: "homeX", group: "Home", label: "Home estouro", file: "homeX.png" },
  { id: "chat0", group: "Chat", label: "Chat vazio", file: "chat0.png" },
  { id: "chatL", group: "Chat", label: "Chat loading", file: "chatL.png" },
  { id: "chatE", group: "Chat", label: "Estimate + chips", file: "chatE.png" },
  { id: "chatT", group: "Chat", label: "Trocar slot", file: "chatT.png" },
  { id: "chatP", group: "Chat", label: "Pular", file: "chatP.png" },
  { id: "chatF", group: "Chat", label: "Foto + estimate", file: "chatF.png" },
  { id: "chatG", group: "Chat", label: "Depois do Gravar", file: "chatG.png" },
  { id: "cfg", group: "Config", label: "Config", file: "cfg.png" },
  { id: "wipe", group: "Config", label: "Wipe do teto", file: "wipe.png" },
  { id: "push", group: "Sistema", label: "Push do slot", file: "push.png" },
];
let go = "home1";
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function notch(t) {
  return `<div class="notch"><span>${t || "20:14"}</span><span>5G  ▮▮▮</span></div>`;
}
function group(items, selected, extra) {
  return `<div class="bgroup ${extra || "col"}">${items.map((it, i) =>
    `<button type="button" class="${i===selected?"on":""}">` +
    (it.s ? `<b>${it.t}</b><small>${it.s}</small>` : it.t) +
    `</button>`).join("")}</div>`;
}
function macros(p, pt, c, ct, g, gt) {
  const bar = (a, b) => {
    const pct = Math.min(100, Math.round(a / b * 100));
    const over = a > b ? " over" : "";
    return `<div class="mbar${over}"><i style="width:${pct}%"></i></div>`;
  };
  return `<div class="macs">
    <div class="mac"><b>P</b>${bar(p,pt)}<span>${p}/${pt} g</span></div>
    <div class="mac"><b>C</b>${bar(c,ct)}<span>${c}/${ct} g</span></div>
    <div class="mac"><b>G</b>${bar(g,gt)}<span>${g}/${gt} g</span></div>
  </div>`;
}
function ring(eaten, teto, over) {
  const pct = Math.min(100, Math.round(eaten / teto * 100));
  return `<div class="ring-wrap"><div class="ring${over?" over":""}" style="--pct:${pct}%">
    <div class="ring-in">
      <div class="n">${eaten}</div>
      <div class="u">kcal comidas</div>
      <div class="sub">teto ${teto}</div>
    </div>
  </div></div>`;
}
function fab() { return `<button class="fab" type="button">Chat</button>`; }
function chatTop() {

function render(id) {
  go = id;
  const v = views[id]();
  document.getElementById("phone").innerHTML = v.html;
  document.getElementById("caption").textContent = v.cap;
  document.getElementById("notes").innerHTML = v.notes;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
}

(function nav() {
  const el = document.getElementById("nav");
  let last = "";
  SCREENS.forEach(s => {
    if (s.group !== last) {
      const k = document.createElement("div");
      k.className = "k"; k.textContent = s.group; el.appendChild(k);
      last = s.group;
    }
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = s.id; b.textContent = s.label;
    b.addEventListener("click", () => render(s.id));
    el.appendChild(b);
  });
})();

document.getElementById("th-dark").onclick = () => {
  document.body.className = "dark";
  document.getElementById("th-dark").classList.add("on");
  document.getElementById("th-light").classList.remove("on");
};
document.getElementById("th-light").onclick = () => {
  document.body.className = "light";
  document.getElementById("th-light").classList.add("on");
  document.getElementById("th-dark").classList.remove("on");
};

render("home1");

function phoneBg(){
  return document.body.classList.contains("light") ? "#f7f6f3" : "#0e1114";
}
function themePrefix(){
  return document.body.classList.contains("light") ? "light-" : "";
}
async function exportOne(item, filename){
  render(item.id);
  await sleep(80);
  const node = document.getElementById("phone");
  const canvas = await html2canvas(node, { backgroundColor: phoneBg(), scale: 2, useCORS: true });
  const a = document.createElement("a");
  a.download = filename || (themePrefix() + item.file);
  a.href = canvas.toDataURL("image/png");
  a.click();
}
async function exportAll(both){
  const st = document.getElementById("status");
  if (typeof html2canvas !== "function") {
    st.textContent = "html2canvas ausente. Rede bloqueada?";
    return;
  }
  const prev = go;
  const prevTheme = document.body.className;
  const run = async (prefix) => {
    for (const item of SCREENS) {
      const file = prefix + item.file;
      st.textContent = "export " + file;
      await exportOne(item, file);
      await sleep(250);
    }
  };
  if (both) {
    document.body.className = "dark";
    document.getElementById("th-dark").classList.add("on");
    document.getElementById("th-light").classList.remove("on");
    await run("");
    document.body.className = "light";
    document.getElementById("th-light").classList.add("on");
    document.getElementById("th-dark").classList.remove("on");
    await run("light-");
    document.body.className = prevTheme;
    document.getElementById("th-dark").classList.toggle("on", prevTheme === "dark");
    document.getElementById("th-light").classList.toggle("on", prevTheme === "light");
  } else {
    await run(themePrefix());
  }
  render(prev);
  st.textContent = "done · mover para docs/qa/wire/painel/";
}
document.getElementById("btn-export").onclick = () => exportAll(false);
document.getElementById("btn-export-both").onclick = () => exportAll(true);
if (new URLSearchParams(location.search).get("export") === "all") {
  window.addEventListener("load", () => exportAll(false));
}
