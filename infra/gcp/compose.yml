# GCP VM stack (ADR-013). Runs from /opt/nutri: server/, infra/gcp/, .env.
# PUBLIC_HOST=<a-b-c-d>.sslip.io docker compose -f infra/gcp/compose.yml up -d --build
services:
  api:
    build: ../../server
    env_file: ../../.env
    # No published port: only Caddy reaches 8080.
    # keep-alive >= 60s (server README); proxy headers so the rate limit sees the client IP.
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --timeout-keep-alive
      - "75"
      - --proxy-headers
      - --forwarded-allow-ips=*
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
