[versions]
agp = "9.4.1"
kotlin = "2.2.20"
composeBom = "2026.09.00"
material3 = "1.5.0-alpha29"
hilt = "2.56.2"
hiltNav = "1.2.0"
navigation = "2.8.9"
activity = "1.9.3"
lifecycle = "2.8.7"
